name: Build Official Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Official Release Keystore
        run: |
          if [ ! -f app/release.keystore ]; then
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias jamavaran_release_key \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "JamAvaran@2026!" \
              -keypass "JamAvaran@2026!" \
              -dname "CN=Sajad Naeimi, OU=Mobile, O=FC Jamavaran, L=SowmeehSara, ST=Gilan, C=IR"
          fi

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Signed Release APK (نسخه اصلی و نهایی)
        run: gradle assembleRelease --no-daemon

      - name: Build Signed Release AAB (ویژه مارکت‌ها)
        run: gradle bundleRelease --no-daemon

      - name: Upload Official Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Official Release AAB & Keystore
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle-and-keystore
          path: |
            app/build/outputs/bundle/release/*.aab
            app/release.keystore