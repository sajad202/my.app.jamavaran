plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def gsFile = file("google-services.json")
if (gsFile.exists()) {
    apply plugin: 'com.google.gms.google-services'
}

def keystoreFile = file("release.keystore")
tasks.register("ensureReleaseKeystore") {
    doLast {
        if (!keystoreFile.exists()) {
            exec {
                commandLine "keytool", "-genkeypair", "-v",
                    "-keystore", keystoreFile.absolutePath,
                    "-alias", "jamavaran_release_key",
                    "-keyalg", "RSA", "-keysize", "2048", "-validity", "10000",
                    "-storepass", "JamAvaran@2026!",
                    "-keypass", "JamAvaran@2026!",
                    "-dname", "CN=Sajad Naeimi, OU=Mobile, O=FC Jamavaran, L=SowmeehSara, ST=Gilan, C=IR"
            }
        }
    }
}
preBuild.dependsOn("ensureReleaseKeystore")

android {
    namespace 'my.app.jamavaran'
    compileSdk 34

    defaultConfig {
        applicationId "my.app.jamavaran"
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName "3.1.0"

        buildConfigField "boolean", "ALLOW_HTTP", "false"
        buildConfigField "boolean", "EXTERNAL_IN_APP", "false"
        buildConfigField "boolean", "PULL_REFRESH", "false"
        buildConfigField "boolean", "UPLOAD_ENABLED", "true"
        buildConfigField "boolean", "DOWNLOADS_ENABLED", "true"
        buildConfigField "boolean", "ZOOM_ENABLED", "false"
        buildConfigField "String", "REST_BASE", "\"https://my.fc-jamavaran.ir/admin/appsaz/\""
        buildConfigField "String", "APP_KEY", "\"JV70ec9cac190e475a\""
        buildConfigField "String", "CUSTOM_CSS", "\"\""
        buildConfigField "String", "CUSTOM_JS", "\"\""
    }

    signingConfigs {
        release {
            storeFile keystoreFile
            storePassword "JamAvaran@2026!"
            keyAlias "jamavaran_release_key"
            keyPassword "JamAvaran@2026!"
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            debuggable false
            jniDebuggable false
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'com.google.firebase:firebase-messaging:24.0.0'
}